<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dear You.</title>
  <meta name="description" content="Some feelings are too beautiful to remain unspoken.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Ambient background layers -->
  <div class="particles" id="particles" aria-hidden="true"></div>
  <div class="celebration" id="celebration" aria-hidden="true"></div>

  <!-- Optional background music toggle; shown only when the audio file loads -->
  <button class="music-toggle" id="musicToggle" type="button" aria-label="Play background music" hidden>
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>
  <audio id="bgMusic" loop></audio>

  <main>
    <!-- PAGE 1: Welcome -->
    <section class="screen is-active" id="screen-welcome" aria-labelledby="welcome-title">
      <p class="kicker">A LITTLE SOMETHING FOR YOU</p>
      <h1 class="display" id="welcome-title">Dear <span data-recipient>You</span>.</h1>
      <p class="lead">I have something to tell you...</p>
      <button class="btn" type="button" data-next="screen-envelope">Begin Reading</button>
    </section>

    <!-- PAGE 2: Envelope -->
    <section class="screen" id="screen-envelope" aria-labelledby="envelope-title">
      <h2 class="sr-only" id="envelope-title">A sealed letter</h2>
      <div class="envelope-stage">
        <div class="envelope" id="envelope">
          <div class="body"></div>
          <div class="letter-peek"></div>
          <div class="flap"></div>
          <div class="seal" aria-hidden="true">D</div>
        </div>
      </div>
      <p class="lead">Someone wrote you a letter.</p>
      <button class="btn" id="openEnvelope" type="button">Open My Letter</button>
